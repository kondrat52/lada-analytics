  if (F.pipeline) {
    const P2 = F.pipeline, it = [[P2.detections, "player detections"], [P2.crops, "close-ups of our players"], [P2.reads, "number and name reads"], [P2.reviewed, "tracks checked by eye"]];
    cards.push(`<div class="numbers">${it.filter(x => x[0]).map(([v, l]) => `<div><b>${v.toLocaleString()}</b><span>${l}</span></div>`).join("")}</div>`);
  }
  const box = document.getElementById("fun");
  box.innerHTML = cards.map((c, i) => c.startsWith('<div class="numbers"') ? c.replace('class="numbers"', 'class="numbers card"') : `<div class="card">${c}</div>`).join("");
  if (!cards.length) document.getElementById("funsec").hidden = true;
})();

// table: two views (whole game / by period), sortable, click a player to highlight his shifts
let view = "game", sortKey = "toi", sortDir = -1, selected = null;
const tbl = document.getElementById("tbl"), rowsEl = tbl.querySelector("tbody");
const maxToi = Math.max(...DATA.players.map(p => p.toi));
const hasPlay = DATA.players.some(p => p.play != null);
const t_ = s => (s == null ? "–" : fmt(s));
const signed = x => (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x);
const COLS = {
  game: [
    { k: "shifts", l: "Shifts", f: p => p.shifts },
    { k: "toi", l: "Ice time", f: p => `${fmt(p.toi)}<span class="bar-in" style="width:${Math.round(60 * p.toi / maxToi)}px"></span>` },
    ...(hasPlay ? [{ k: "play", l: "Live play", f: p => t_(p.play) }] : []),
    { k: "plus_minus", l: "+/−", t: "Goals for minus goals against while on the ice (goals on video)", f: p => signed(p.plus_minus) },
    { k: "avg", l: "Avg shift", f: p => fmt(p.avg) },
    { k: "median", l: "Median", f: p => fmt(p.median) },
    { k: "longest", l: "Longest", f: p => fmt(p.longest) },
    { k: "shortest", l: "Shortest", f: p => t_(p.shortest) },
  ],
  period: P.flatMap((per, i) => [
    { k: `p${i}n`, l: "Shifts", g: per.label, f: p => (p.per[i] ? p.per[i][0] : "–"), first: true },
    { k: `p${i}t`, l: "Ice time", f: p => t_(p.per[i] && p.per[i][1]) },
    { k: `p${i}a`, l: "Avg shift", f: p => t_(p.per[i] && p.per[i][2]) },
  ]),
};
function val(p, k) {
  const m = /^p(\d)([nta])$/.exec(k);
  if (m) { const x = p.per[+m[1]]; return x ? x["nta".indexOf(m[2])] : -1; }
  return p[k] ?? Infinity;
}
function renderHead() {
  const cols = COLS[view];
  let h = "";
  if (view === "period")
    h += `<tr><th colspan="2"></th>${P.map(per => `<th class="grp" colspan="3">${per.label}</th>`).join("")}</tr>`;
  h += `<tr><th class="l" data-k="num" tabindex="0">#</th><th class="l" data-k="name" tabindex="0">Player</th>` +
    cols.map(c => `<th data-k="${c.k}" tabindex="0" class="${c.first ? "gs" : ""}"${c.t ? ` title="${c.t}"` : ""}>${c.l}</th>`).join("") + "</tr>";
  tbl.querySelector("thead").innerHTML = h;
  tbl.querySelectorAll("th[data-k]").forEach(th => {
    const go = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "name" || k === "num" ? 1 : -1); sortKey = k; renderTable(); };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}
function renderTable() {
  const rows = [...DATA.players].sort((a, b) => {
    const x = val(a, sortKey), y = val(b, sortKey);
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
  });
  rowsEl.innerHTML = rows.map(p => `<tr data-n="${p.num}" class="${selected === p.num ? "sel" : ""}">
    <td class="l num">${p.num}</td><td class="l name">${p.name || "<span style='color:var(--muted)'>(name?)</span>"}${p.sub ? "<span class='sub'>sub</span>" : ""}</td>` +
    COLS[view].map(c => `<td class="${c.first ? "gs" : ""}">${c.f(p)}</td>`).join("") + "</tr>").join("");
  tbl.querySelectorAll("th[data-k]").forEach(th => th.setAttribute("aria-sort", th.dataset.k === sortKey ? (sortDir < 0 ? "descending" : "ascending") : "none"));
}
function setView(v) {
  view = v;
  document.getElementById("v-game").setAttribute("aria-selected", v === "game");
  document.getElementById("v-period").setAttribute("aria-selected", v === "period");
  renderHead(); renderTable();
}
document.getElementById("v-game").addEventListener("click", () => setView("game"));
document.getElementById("v-period").addEventListener("click", () => setView("period"));
rowsEl.addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const n = +tr.dataset.n; selected = selected === n ? null : n; renderTable(); highlight();
});

// timeline: one lane per player, three period blocks side by side, shared seconds scale
const svg = document.getElementById("tl");
const order = [...DATA.players].sort((a, b) => a.num - b.num);
const LW = 118, LANE = 22, TOP = 30, GAP = 18, W = 1060;
const totalLen = P.reduce((a, p) => a + (p.end - p.start), 0);
const scale = (W - LW - GAP * (P.length - 1) - 28) / totalLen;
const x0s = []; let acc = LW;
P.forEach(p => { x0s.push(acc); acc += (p.end - p.start) * scale + GAP; });
const H = TOP + order.length * LANE + 8;
svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
let g = "";
P.forEach((p, i) => {
  const x = x0s[i], w = (p.end - p.start) * scale;
  g += `<text x="${x}" y="14" font-size="13" font-weight="600">${p.label}</text>`;
  for (let m = 5; m * 60 < p.end - p.start; m += 5) {
    const xx = x + m * 60 * scale;
    g += `<line class="grid" x1="${xx}" x2="${xx}" y1="${TOP - 6}" y2="${H - 6}"/>`;
    g += `<text class="mut" x="${xx}" y="${TOP - 10}" font-size="11" text-anchor="middle">${m}:00</text>`;
  }
  g += `<rect class="pbox" x="${x}" y="${TOP - 4}" width="${w}" height="${H - TOP - 2}"/>`;
});
(DATA.stoppages || []).forEach(([a, b]) => {
  const pi = P.findIndex(p => a >= p.start && a < p.end); if (pi < 0) return;
  const per = P[pi], x = x0s[pi] + (a - per.start) * scale, w = (Math.min(b, per.end) - a) * scale;
  g += `<rect x="${x.toFixed(1)}" y="${TOP - 4}" width="${Math.max(1, w).toFixed(1)}" height="${H - TOP - 2}" class="stop"/>`;
});
order.forEach((p, r) => {
  const y = TOP + r * LANE;
  g += `<text x="6" y="${y + 15}" font-size="14"><tspan font-weight="600" class="tnum">${p.num}</tspan> ${p.name || ""}</text>`;
});
DATA.shifts.forEach(s => {
  const r = order.findIndex(p => p.num === s.player), pi = P.findIndex(p => p.label === s.period);
  if (r < 0 || pi < 0) return;
  const per = P[pi], x = x0s[pi] + (s.t0 - per.start) * scale, w = Math.max(2, (s.t1 - s.t0) * scale);
  g += vlink(Math.round(s.t0) - 3, `<rect class="bar" tabindex="0" data-n="${s.player}" data-tip="#${s.player} ${s.period} ${fmt(s.t0 - per.start)}–${fmt(s.t1 - per.start)} (${fmt(s.t1 - s.t0)})" x="${x.toFixed(1)}" y="${TOP + r * LANE + 3}" width="${w.toFixed(1)}" height="${LANE - 7}" rx="2"/>`);
});
svg.innerHTML = g;
function highlight() {
  svg.classList.toggle("dim", selected !== null);
  svg.querySelectorAll(".bar").forEach(b => b.classList.toggle("hi", +b.dataset.n === selected));
}
const tip = document.getElementById("tip");
svg.addEventListener("mousemove", e => {
  const b = e.target.closest(".bar");
  if (!b) { tip.hidden = true; return; }
  tip.textContent = b.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
svg.addEventListener("mouseleave", () => tip.hidden = true);
renderHead(); renderTable();
</script>
