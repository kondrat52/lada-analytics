const VIDEO = DATA.video;
// a link to [t] seconds into the video; keeps watch?v= links' own query
const at = t => { const u = new URL(VIDEO); u.searchParams.set("t", Math.max(0, t)); return u.href; };
// with no public video (a local recording) the times stay plain text
const vlink = (t, inner) => VIDEO ? `<a href="${at(t)}" target="_blank" rel="noopener">${inner}</a>` : inner;
const fmt = s => { s = Math.round(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const P = DATA.periods;

// facts strip
const tot = DATA.players.reduce((a, p) => a + p.toi, 0);
const nsh = DATA.players.reduce((a, p) => a + p.shifts, 0);
document.getElementById("facts").innerHTML = [
  [DATA.players.length, "skaters"],
  [P.map(p => fmt(p.end - p.start)).join(" · "), "period lengths"],
  [nsh, "shifts"],
  [fmt(tot / nsh), "average shift"],
].concat((() => {
  const S = DATA.shots;   // {"P1": [ours, theirs], ...} from the arena scoreboard
  if (!S) return [];
  const per = P.filter(p => S[p.label]).map(p => S[p.label]);
  const f = per.reduce((a, x) => a + x[0], 0), g = per.reduce((a, x) => a + x[1], 0);
  return [[`${f}–${g}`, `shots on goal · by period ${per.map(x => x.join("–")).join(", ")}`]];
})()).concat((() => {
  const top = [...DATA.players].sort((a, b) => b.toi - a.toi)[0];
  const ls = DATA.shifts.reduce((a, s) => (s.t1 - s.t0 > a.t1 - a.t0 ? s : a));
  const lp = DATA.players.find(p => p.num === ls.player);
  const sp = DATA.players.filter(p => p.shortest != null).reduce((a, p) => (p.shortest < a.shortest ? p : a));
  return [[`#${top.num} ${top.name} · ${fmt(top.toi)}`, "most ice time"],
          [`#${lp.num} ${lp.name} · ${fmt(ls.t1 - ls.t0)}`, "longest shift"],
          [`#${sp.num} ${sp.name} · ${fmt(sp.shortest)}`, "shortest shift"]];
})()).map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
// highlights
(() => {
  const H = DATA.highlights || [];
  if (!H.length) { document.getElementById("hlsec").hidden = true; return; }
  const name = n => (DATA.players.find(p => p.num === n) || {}).name || "";
  const periodName = l => /^P\d+$/.test(l) ? `Period ${l.slice(1)}` : l;   // "Period 1" for P1; OT as written
  const gf = H.filter(h => h.type === "goal" && h.team === "for").length, ga = H.filter(h => h.type === "goal" && h.team === "against").length;
  document.getElementById("score").textContent = `Goals on video: ${DATA.team} ${gf} · ${DATA.opponent} ${ga}`;
  document.getElementById("hls").innerHTML = H.map(h => {
    const kind = h.type === "goal" ? (h.team === "for" ? `${DATA.team} goal` : `${DATA.opponent} goal`) : h.type === "moment" ? (h.title || "Moment") : `Penalty${h.player ? ` · #${h.player} ${name(h.player)}` : ""}`;
    const cls = h.type === "goal" ? h.team : h.type === "moment" ? "moment" : "penalty";
    const on = h.on_ice && h.on_ice.length ? `<div class="on">On the ice: ${h.on_ice.map(n => `<b>#${n}</b> ${name(n)}`).join(", ")}</div>` : "";
    return `<div class="hl"><video controls playsinline preload="none" poster="${h.poster}"><source src="${h.clip}" type="video/mp4"></video>
      <div class="cap"><div class="kind ${cls}">${kind}</div>
      <div class="meta">${periodName(h.period)} · ${vlink(h.t - 10, `${fmt(h.t)} in the full video`)}${h.note ? ` · ${h.note}` : ""}</div>${on}</div></div>`;
  }).join("");
})();

// fun stats
(() => {
  const F = DATA.fun || {}, name = n => (DATA.players.find(p => p.num === n) || {}).name || "";
  const who = n => `<b class="n">#${n}</b> ${name(n)}`;
  const cards = [];
  const list = rows => `<ul>${rows.map(([a, b]) => `<li><span>${a}</span><span>${b}</span></li>`).join("")}</ul>`;
  if (F.pairs && F.pairs.length) cards.push(`<h3>Best duos</h3>${list(F.pairs.map(p => [`${who(p.a)} + ${who(p.b)}`, fmt(p.sec)]))}`);
  if (F.unit) cards.push(`<h3>Most-used five</h3>${list(F.unit.players.map(n => [who(n), ""]))}<p>Together for ${fmt(F.unit.sec)} of the game.</p>`);
  if (F.periods) {
    const mx = Math.max(...F.periods.map(p => p.avg));
    cards.push(`<h3>Shift length by period</h3>${F.periods.map(p => `<div class="pbar"><span>${p.label}</span><i style="width:${Math.round(100 * p.avg / mx)}%"></i><span>${fmt(p.avg)} avg · ${p.n} shifts</span></div>`).join("")}`);
  }
  if (F.quickest) cards.push(`<h3>Quickest changer</h3><div class="big">${who(F.quickest.num)}</div><p>${fmt(F.quickest.avg)} average shift.</p>` +
    (F.most ? `<h3>Most shifts</h3><div>${F.most.nums.map(who).join(", ")}</div><p>${F.most.n} shifts each.</p>` : ""));
  (F.pk || []).forEach(k => cards.push(`<h3>Penalty kill</h3><p>${k.period} ${fmt(k.from)}–${fmt(k.to)}${k.player ? ` · ${who(k.player)} in the box` : ""}</p>${list(k.crew.map(c => [who(c.num), fmt(c.sec)]))}`));
  if (F.reads && F.reads.length > 1) {
    const top = F.reads[0], low = F.reads[F.reads.length - 1];
    cards.push(`<h3>Most readable jersey</h3><div class="big">${who(top.num)}</div><p>Name read ${top.n.toLocaleString()} times by the software. Hardest to read: ${who(low.num)}, ${low.n} times.</p>`);
  }
  if (F.pipeline) {
    const P2 = F.pipeline, it = [[P2.detections, "player detections"], [P2.crops, "close-ups of our players"], [P2.reads, "number and name reads"], [P2.reviewed, "tracks checked by eye"]];
    cards.push(`<div class="numbers">${it.filter(x => x[0]).map(([v, l]) => `<div><b>${v.toLocaleString()}</b><span>${l}</span></div>`).join("")}</div>`);
  }
  const box = document.getElementById("fun");
  box.innerHTML = cards.map((c, i) => c.startsWith('<div class="numbers"') ? c.replace('class="numbers"', 'class="numbers card"') : `<div class="card">${c}</div>`).join("");
  if (!cards.length) document.getElementById("funsec").hidden = true;
})();

const t_ = s => (s == null ? "–" : fmt(s));
const signed = x => (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x);
const COLS = {
  game: [
    { k: "shifts", l: "Shifts", f: p => p.shifts },
    { k: "toi", l: "Ice time", f: p => `${fmt(p.toi)}<span class="bar-in" style="width:${Math.round(60 * p.toi / maxToi)}px"></span>` },
    ...(hasPlay ? [{ k: "play", l: "Live play", f: p => t_(p.play) }] : []),
    { k: "plus_minus", l: "+/−", t: "Goals for minus goals against while on the ice (goals on video)", f: p => signed(p.plus_minus) },
    { k: "avg", l: "Avg shift", f: p => fmt(p.avg) },
    { k: "median", l: "Median", f: p => fmt(p.median) },
    { k: "longest", l: "Longest", f: p => fmt(p.longest) },
    { k: "shortest", l: "Shortest", f: p => t_(p.shortest) },
  ],
  period: P.flatMap((per, i) => [
    { k: `p${i}n`, l: "Shifts", g: per.label, f: p => (p.per[i] ? p.per[i][0] : "–"), first: true },
    { k: `p${i}t`, l: "Ice time", f: p => t_(p.per[i] && p.per[i][1]) },
    { k: `p${i}a`, l: "Avg shift", f: p => t_(p.per[i] && p.per[i][2]) },
  ]),
};
function val(p, k) {
  const m = /^p(\d)([nta])$/.exec(k);
  if (m) { const x = p.per[+m[1]]; return x ? x["nta".indexOf(m[2])] : -1; }
  return p[k] ?? Infinity;
}
function renderHead() {
  const cols = COLS[view];
  let h = "";
  if (view === "period")
    h += `<tr><th colspan="2"></th>${P.map(per => `<th class="grp" colspan="3">${per.label}</th>`).join("")}</tr>`;
  h += `<tr><th class="l" data-k="num" tabindex="0">#</th><th class="l" data-k="name" tabindex="0">Player</th>` +
    cols.map(c => `<th data-k="${c.k}" tabindex="0" class="${c.first ? "gs" : ""}"${c.t ? ` title="${c.t}"` : ""}>${c.l}</th>`).join("") + "</tr>";
  tbl.querySelector("thead").innerHTML = h;
  tbl.querySelectorAll("th[data-k]").forEach(th => {
    const go = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "name" || k === "num" ? 1 : -1); sortKey = k; renderTable(); };
    th.addEventListener("click", go);
    th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}
function renderTable() {
  const rows = [...DATA.players].sort((a, b) => {
    const x = val(a, sortKey), y = val(b, sortKey);
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * sortDir;
  });
  rowsEl.innerHTML = rows.map(p => `<tr data-n="${p.num}" class="${selected === p.num ? "sel" : ""}">
    <td class="l num">${p.num}</td><td class="l name">${p.name || "<span style='color:var(--muted)'>(name?)</span>"}${p.sub ? "<span class='sub'>sub</span>" : ""}</td>` +
    COLS[view].map(c => `<td class="${c.first ? "gs" : ""}">${c.f(p)}</td>`).join("") + "</tr>").join("");
  tbl.querySelectorAll("th[data-k]").forEach(th => th.setAttribute("aria-sort", th.dataset.k === sortKey ? (sortDir < 0 ? "descending" : "ascending") : "none"));
}
function setView(v) {
  view = v;
  document.getElementById("v-game").setAttribute("aria-selected", v === "game");
  document.getElementById("v-period").setAttribute("aria-selected", v === "period");
  renderHead(); renderTable();
}
document.getElementById("v-game").addEventListener("click", () => setView("game"));
document.getElementById("v-period").addEventListener("click", () => setView("period"));
rowsEl.addEventListener("click", e => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const n = +tr.dataset.n; selected = selected === n ? null : n; renderTable(); highlight();
  if (selected !== null) iceShow(selected);
});

// timeline: one lane per player, three period blocks side by side, shared seconds scale
const svg = document.getElementById("tl");
const order = [...DATA.players].sort((a, b) => a.num - b.num);
const LW = 118, LANE = 22, TOP = 30, GAP = 18, W = 1060;
const totalLen = P.reduce((a, p) => a + (p.end - p.start), 0);
const scale = (W - LW - GAP * (P.length - 1) - 28) / totalLen;
const x0s = []; let acc = LW;
P.forEach(p => { x0s.push(acc); acc += (p.end - p.start) * scale + GAP; });
const H = TOP + order.length * LANE + 8;
svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
let g = "";
P.forEach((p, i) => {
  const x = x0s[i], w = (p.end - p.start) * scale;
  g += `<text x="${x}" y="14" font-size="13" font-weight="600">${p.label}</text>`;
  for (let m = 5; m * 60 < p.end - p.start; m += 5) {
    const xx = x + m * 60 * scale;
    g += `<line class="grid" x1="${xx}" x2="${xx}" y1="${TOP - 6}" y2="${H - 6}"/>`;
    g += `<text class="mut" x="${xx}" y="${TOP - 10}" font-size="11" text-anchor="middle">${m}:00</text>`;
  }
  g += `<rect class="pbox" x="${x}" y="${TOP - 4}" width="${w}" height="${H - TOP - 2}"/>`;
});
(DATA.stoppages || []).forEach(([a, b]) => {
  const pi = P.findIndex(p => a >= p.start && a < p.end); if (pi < 0) return;
  const per = P[pi], x = x0s[pi] + (a - per.start) * scale, w = (Math.min(b, per.end) - a) * scale;
  g += `<rect x="${x.toFixed(1)}" y="${TOP - 4}" width="${Math.max(1, w).toFixed(1)}" height="${H - TOP - 2}" class="stop"/>`;
});
order.forEach((p, r) => {
  const y = TOP + r * LANE;
  g += `<text x="6" y="${y + 15}" font-size="14"><tspan font-weight="600" class="tnum">${p.num}</tspan> ${p.name || ""}</text>`;
});
DATA.shifts.forEach(s => {
  const r = order.findIndex(p => p.num === s.player), pi = P.findIndex(p => p.label === s.period);
  if (r < 0 || pi < 0) return;
  const per = P[pi], x = x0s[pi] + (s.t0 - per.start) * scale, w = Math.max(2, (s.t1 - s.t0) * scale);
  g += vlink(Math.round(s.t0) - 3, `<rect class="bar" tabindex="0" data-n="${s.player}" data-tip="#${s.player} ${s.period} ${fmt(s.t0 - per.start)}–${fmt(s.t1 - per.start)} (${fmt(s.t1 - s.t0)})" x="${x.toFixed(1)}" y="${TOP + r * LANE + 3}" width="${w.toFixed(1)}" height="${LANE - 7}" rx="2"/>`);
});
svg.innerHTML = g;
function highlight() {
  svg.classList.toggle("dim", selected !== null);
  svg.querySelectorAll(".bar").forEach(b => b.classList.toggle("hi", +b.dataset.n === selected));
}
const tip = document.getElementById("tip");
svg.addEventListener("mousemove", e => {
  const b = e.target.closest(".bar");
  if (!b) { tip.hidden = true; return; }
  tip.textContent = b.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
});
svg.addEventListener("mouseleave", () => tip.hidden = true);

// ice maps: the team's beside one player's, from game.json's "ice" (ice.py): 2 ft cells, our net at the bottom
let iceShow = () => {};
if (DATA.ice) (() => {
  const I = DATA.ice, CH = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ", TOPQ = CH.length - 1;
  const RAMPS = {   // one hue: light to dark on the white board, dark to bright on the dark one
    light: ["#fff1e6", "#fbd3b8", "#f5a578", "#eb6834", "#c4481a", "#8f300e", "#5e1f08"],
    dark: ["#33262a", "#5c3123", "#8a3f1f", "#b85224", "#dd6a32", "#f08f55", "#f7b688"] };
  const ZONES = ["Offence", "Neutral", "Defence"];
  const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const color = (ramp, t) => {
    const x = t * (ramp.length - 1), i = Math.min(Math.floor(x), ramp.length - 2), f = x - i, a = rgb(ramp[i]), b = rgb(ramp[i + 1]);
    return a.map((v, k) => Math.round(v + (b[k] - v) * f));
  };
  const player = n => DATA.players.find(p => p.num === n) || { name: "", toi: 0 };
  const heat = m => {   // the grid as a picture, one pixel per cell, our end at the bottom; the browser smooths it
    const c = document.createElement("canvas"); c.width = I.cols; c.height = I.rows;
    const ctx = c.getContext("2d"), img = ctx.createImageData(I.cols, I.rows), ramp = RAMPS[isDark() ? "dark" : "light"];
    for (let r = 0; r < I.rows; r++) for (let k = 0; k < I.cols; k++) {
      const t = CH.indexOf(m.grid[r * I.cols + k]) / TOPQ;
      if (t < 0.01) continue;   // fade in over the lowest values, so a map's edges are soft
      img.data.set([...color(ramp, t), Math.round(235 * Math.min(1, t / 0.15))], ((I.rows - 1 - r) * I.cols + k) * 4);
    }
    ctx.putImageData(img, 0, 0); return c.toDataURL();
  };
  // the rink in feet, x across (-42.5 left .. 42.5 right), y = -V (their end at the top)
  const rink = (id, m) => {
    let s = `<defs><clipPath id="${id}c"><rect x="-42.5" y="-100" width="85" height="200" rx="28"/></clipPath></defs>
      <rect class="rk" x="-42.5" y="-100" width="85" height="200" rx="28"/>
      <image href="${heat(m)}" x="-42" y="-100" width="84" height="200" preserveAspectRatio="none" clip-path="url(#${id}c)"/>
      <g clip-path="url(#${id}c)"><rect class="red" x="-42.5" y="-0.5" width="85" height="1"/>
      <rect class="blue" x="-42.5" y="-25.5" width="85" height="1"/><rect class="blue" x="-42.5" y="24.5" width="85" height="1"/>
      <rect class="red" x="-42.5" y="-89.15" width="85" height=".3"/><rect class="red" x="-42.5" y="88.85" width="85" height=".3"/></g>
      <path class="bluel" d="M -6 -89 A 6 6 0 0 0 6 -89"/><path class="bluel" d="M -6 89 A 6 6 0 0 1 6 89"/>
      <circle class="bluel" cx="0" cy="0" r="15"/><circle class="blue" cx="0" cy="0" r=".8"/>`;
    for (const y of [-69, 69]) for (const x of [-22, 22]) s += `<circle class="redl" cx="${x}" cy="${y}" r="15"/><circle class="red" cx="${x}" cy="${y}" r="1"/>`;
    for (const y of [-20, 20]) for (const x of [-22, 22]) s += `<circle class="red" cx="${x}" cy="${y}" r="1"/>`;
    s += `<rect class="rk-edge" x="-42.5" y="-100" width="85" height="200" rx="28"/>`;
    m.zones.forEach((v, i) => {
      const y = [-62, 0, 62][i];
      s += `<text class="zl" x="0" y="${y - 7}">${ZONES[i].toUpperCase()}</text><text class="zv" x="0" y="${y + 5}">${Math.round(v * 100)}%</text>`;
    });
    return s;
  };
  const shown = [null, null];
  const draw = (i, n) => {
    shown[i] = n;
    const m = n === null ? I.team : I.players[n], el = document.getElementById(`ice${i}`), p = player(n);
    el.setAttribute("viewBox", "-44 -102 88 204");
    el.innerHTML = rink(`ice${i}`, m);
    if (i === 0) document.getElementById("icecap0").textContent = "Team";   // the other map's caption is the player picker
    el.setAttribute("aria-label", `Ice map, ${n === null ? "team" : `#${n} ${p.name}`}: ` + m.zones.map((v, k) => `${ZONES[k].toLowerCase()} ${Math.round(v * 100)}%`).join(", "));
  };
  const sel = document.getElementById("icesel");
  const ranked = Object.keys(I.players).map(Number).sort((a, b) => player(b).toi - player(a).toi);
  sel.innerHTML = ranked.map(n => `<option value="${n}">#${n} ${player(n).name}</option>`).join("");
  sel.addEventListener("change", () => draw(1, +sel.value));
  iceShow = n => { if (!I.players[n]) return; sel.value = n; draw(1, n); };
  const legend = () => document.getElementById("iceramp").style.background = `linear-gradient(90deg, ${RAMPS[isDark() ? "dark" : "light"].join(", ")})`;
  const redraw = () => { draw(0, shown[0]); draw(1, shown[1]); legend(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  [0, 1].forEach(i => {   // hover: the zone under the pointer, its share and time
    const el = document.getElementById(`ice${i}`);
    el.addEventListener("mousemove", e => {
      const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(el.getScreenCTM().inverse()), V = -pt.y;
      if (Math.abs(V) > 100 || Math.abs(pt.x) > 42.5) { tip.hidden = true; return; }
      const z = V > 25 ? 0 : V >= -25 ? 1 : 2, m = shown[i] === null ? I.team : I.players[shown[i]];
      tip.textContent = `${shown[i] === null ? "Team" : `#${shown[i]} ${player(shown[i]).name}`} · ${ZONES[z]} ${Math.round(m.zones[z] * 100)}% · ${fmt(m.sec * m.zones[z])}`;
      tip.hidden = false;
      tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
    });
    el.addEventListener("mouseleave", () => tip.hidden = true);
  });
  draw(0, null); draw(1, ranked[0]); legend();
  document.getElementById("icesec").hidden = false;
})();
renderHead(); renderTable();
</script>
